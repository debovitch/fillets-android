apply plugin: 'com.android.application'

android {
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId = 'com.dodecamoon.fishfillets'
        minSdk = 21
        targetSdk = 37
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        versionName '1.3.2'
        versionCode 26102419
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
        prefab true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    namespace 'com.dodecamoon.fishfillets'
}

dependencies {
    implementation 'com.google.oboe:oboe:1.11.0'
}
